syntax = "proto3";

package eebus.v1;

option go_package = "github.com/volschin/eebus-bridge/gen/proto/eebus/v1;eebusv1";

import "eebus/v1/common.proto";

// HVACService exposes the room-heating Configuration use cases validated
// against the Vaillant VR940 HVACRoom entity.
//
// A device may have several heating zones, each with its own HVACRoom entity.
// A zone is addressed by zone_id, the entity's SPINE address joined with dots
// (e.g. "5.1.1"). Writes without zone_id are accepted only for a device with
// exactly one zone; with several zones they fail with FAILED_PRECONDITION
// rather than guess. An unknown zone_id is NOT_FOUND.
service HVACService {
  // GetRoomHeating returns the device's first zone in address order. Use
  // ListRoomHeatingZones for devices with several zones.
  rpc GetRoomHeating(DeviceRequest) returns (RoomHeatingState);
  // ListRoomHeatingZones returns every readable zone in address order.
  rpc ListRoomHeatingZones(DeviceRequest) returns (RoomHeatingZoneList);
  rpc SetRoomHeatingTemperature(SetRoomHeatingTemperatureRequest) returns (Empty);
  rpc SetRoomHeatingMode(SetRoomHeatingModeRequest) returns (Empty);
  rpc SubscribeRoomHeatingEvents(DeviceRequest) returns (stream RoomHeatingEvent);
}

message RoomHeatingZone {
  string zone_id = 1;
  RoomHeatingState state = 2;
}

message RoomHeatingZoneList {
  repeated RoomHeatingZone zones = 1;
}

message RoomHeatingState {
  optional double current_temperature_celsius = 1;
  RoomHeatingSetpoint setpoint = 2;
  RoomHeatingSystemFunction system_function = 3;
  // zone_label carries deviceClassificationUserData.userLabel from the remote
  // HeatingZone entity (e.g. "Zone 1"). Unset when the device publishes no
  // label; an absent label is normal, not a read failure.
  optional string zone_label = 4;
}

message RoomHeatingSetpoint {
  double value_celsius = 1;
  double min_celsius = 2;
  double max_celsius = 3;
  double step_celsius = 4;
  bool writable = 5;
}

message RoomHeatingSystemFunction {
  string operation_mode = 1;
  repeated string available_modes = 2;
  bool mode_writable = 3;
}

message SetRoomHeatingTemperatureRequest {
  string ski = 1;
  double value_celsius = 2;
  // Zone to write; may be omitted only for a device with exactly one zone.
  optional string zone_id = 3;
}

message SetRoomHeatingModeRequest {
  string ski = 1;
  string mode = 2;
  // Zone to write; may be omitted only for a device with exactly one zone.
  optional string zone_id = 3;
}

enum RoomHeatingEventType {
  ROOM_HEATING_EVENT_UNSPECIFIED = 0;
  ROOM_HEATING_EVENT_SUPPORT_UPDATED = 1;
  ROOM_HEATING_EVENT_CURRENT_TEMPERATURE_UPDATED = 2;
  ROOM_HEATING_EVENT_SETPOINT_UPDATED = 3;
  ROOM_HEATING_EVENT_SYSTEM_FUNCTION_UPDATED = 4;
}

message RoomHeatingEvent {
  string ski = 1;
  RoomHeatingEventType event_type = 2;
  RoomHeatingState state = 3;
  // Zone the event belongs to, if known; state then describes this zone.
  optional string zone_id = 4;
}
